# Fallback (DR) topology for the VPS when primary physical nodes are down.
# Excludes heavy monitoring (Prometheus/Grafana) to run comfortably within 2 GB RAM.
#
#   internet --443--> caddy (auto-TLS) --> frontend (nginx: SPA + /api proxy) --> backend
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.fallback.yml --env-file deploy/.env up -d --build
#
# Or run from deploy/ directory using Makefile targets by setting COMPOSE file.

services:
  backend:
    build: ../simpleBEDB
    image: ${BACKEND_IMAGE:-glework-backend:${TAG:-latest}}
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # If using PostgreSQL migration later, configure connection details here:
      # - PGHOST=db
      # - PGUSER=${PGUSER}
      # - PGPASSWORD=${PGPASSWORD}
      # - PGDATABASE=${PGDATABASE}
      # - PGPORT=5432
    volumes:
      - backend-data:/app/data
    expose:
      - "3001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M

  frontend:
    build: ..
    image: ${FRONTEND_IMAGE:-glework-frontend:${TAG:-latest}}
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  backend-data:
  caddy-data:
  caddy-config:
