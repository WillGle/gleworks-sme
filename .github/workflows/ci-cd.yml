name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---- CI: quality gates on every push & PR -------------------------------
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:run
      - run: npm run build

  # ---- CD: build both images and publish to GHCR --------------------------
  images:
    name: Build & push images (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend image metadata
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glework-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend image metadata
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glework-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleBEDB
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Deploy: pull the new images on the VPS -----------------------------
  # Optional. Enable by setting repo variable DEPLOY_ENABLED=true and secrets
  # VPS_HOST / VPS_USER / VPS_SSH_KEY. The host must already be provisioned
  # (see deploy/ansible) so /opt/gleworks and deploy/.env exist.
  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Pull & restart over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gleworks
            git pull --ff-only
            export FRONTEND_IMAGE=ghcr.io/${{ steps.owner.outputs.lc }}/glework-frontend:latest
            export BACKEND_IMAGE=ghcr.io/${{ steps.owner.outputs.lc }}/glework-backend:latest
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env pull frontend backend
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
            docker image prune -f
