---
# Provision a fresh Ubuntu/Debian VPS and bring up the GleWorks stack.
#
#   ansible-playbook -i inventory.ini playbook.yml \
#     -e domain=demo.example.com \
#     -e jwt_secret="$(openssl rand -hex 32)" \
#     -e grafana_admin_password='a-strong-password'
#
# Uses only ansible.builtin modules — no extra collections required.
- name: Deploy GleWorks
  hosts: gleworks
  become: true
  vars:
    repo_url: "https://github.com/WillGle/GleWorks.git"
    repo_branch: "main"
    app_dir: "/opt/gleworks"
    grafana_anon_enabled: "false"
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git]
        update_cache: true
        state: present

    - name: Install Docker Engine + Compose plugin (official convenience script)
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Clone or update the GleWorks repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Render deploy/.env (secrets, mode 0600)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/deploy/.env"
        mode: "0600"
        content: |
          DOMAIN={{ domain }}
          JWT_SECRET={{ jwt_secret }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password | default('') }}
          GRAFANA_ANON_ENABLED={{ grafana_anon_enabled | default('false') }}
          FRONTEND_IMAGE={{ frontend_image | default('glework-frontend') }}
          BACKEND_IMAGE={{ backend_image | default('glework-backend') }}
          TAG={{ tag | default('latest') }}

    - name: Pull images from registry
      ansible.builtin.command:
        cmd: docker compose -f deploy/{{ compose_file | default('docker-compose.prod.yml') }} --env-file deploy/.env pull
        chdir: "{{ app_dir }}"
      register: compose_pull
      changed_when: true

    - name: Start the stack (without building)
      ansible.builtin.command:
        cmd: docker compose -f deploy/{{ compose_file | default('docker-compose.prod.yml') }} --env-file deploy/.env up -d
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: true

    - name: Show running services
      ansible.builtin.command:
        cmd: docker compose -f deploy/{{ compose_file | default('docker-compose.prod.yml') }} ps
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ compose_ps.stdout_lines }}"
